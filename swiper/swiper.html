<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabs Swiper</title>
  <link rel="stylesheet" href="swiper.css">
</head>
<body>
  <div class="swiper-container">
    <div class="header">
      <h1>Tabs Swiper</h1>
      <div class="stats">
        <span class="stat-item">
          <span class="stat-label">Przeglądnięte:</span>
          <span class="stat-value stat-viewed" id="current-index">0</span> / <span class="stat-value stat-total" id="total-tabs">0</span>
        </span>
        <span class="stat-item">
          <span class="stat-label">Zamknięte:</span>
          <span class="stat-value stat-closed" id="closed-count">0</span>
        </span>
        <span class="stat-item">
          <span class="stat-label">Zostawione:</span>
          <span class="stat-value stat-kept" id="kept-count">0</span>
        </span>
      </div>
    </div>
    
    <div class="cards-stack" id="cards-stack">
      <!-- Karty będą dodawane dynamicznie -->
    </div>
    
    <div class="controls">
      <button class="btn-close" id="btn-close" title="Zamknij (←)">
        <span>✕</span>
      </button>
      <button class="btn-keep" id="btn-keep" title="Zostaw (→)">
        <span>♥</span>
      </button>
    </div>
    
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Ładowanie zakładek...</p>
    </div>
    
        <div class="empty" id="empty" style="display: none;">
          <p>🎉 Wszystkie zakładki przejrzane!</p>
          <p>Możesz zamknąć to okno.</p>
          <div class="empty-footer">
            <p class="empty-message">
              Jeśli podoba Ci się ta wtyczka, daj ⭐ na 
              <a href="https://github.com/Qbeczek1/tabs-swiper" target="_blank" rel="noopener noreferrer">GitHub</a>
            </p>
            <p class="empty-reminder">
              💡 Pamiętaj o regularnym przeglądaniu zakładek - Twój RAM będzie wdzięczny!
            </p>
          </div>
        </div>
  </div>
  
  <!-- Celebration Modal -->
  <div class="celebration-overlay" id="celebration-overlay" style="display: none;">
    <!-- Confetti na całym ekranie -->
    <div class="confetti-container">
      <div class="confetti confetti-1"></div>
      <div class="confetti confetti-2"></div>
      <div class="confetti confetti-3"></div>
      <div class="confetti confetti-4"></div>
      <div class="confetti confetti-5"></div>
      <div class="confetti confetti-6"></div>
      <div class="confetti confetti-7"></div>
      <div class="confetti confetti-8"></div>
      <div class="confetti confetti-9"></div>
      <div class="confetti confetti-10"></div>
      <div class="confetti confetti-11"></div>
      <div class="confetti confetti-12"></div>
      <div class="confetti confetti-13"></div>
      <div class="confetti confetti-14"></div>
      <div class="confetti confetti-15"></div>
      <div class="confetti confetti-16"></div>
      <div class="confetti confetti-17"></div>
      <div class="confetti confetti-18"></div>
      <div class="confetti confetti-19"></div>
      <div class="confetti confetti-20"></div>
      <div class="confetti confetti-21"></div>
      <div class="confetti confetti-22"></div>
      <div class="confetti confetti-23"></div>
      <div class="confetti confetti-24"></div>
      <div class="confetti confetti-25"></div>
      <div class="confetti confetti-26"></div>
      <div class="confetti confetti-27"></div>
      <div class="confetti confetti-28"></div>
      <div class="confetti confetti-29"></div>
      <div class="confetti confetti-30"></div>
      <div class="confetti confetti-31"></div>
      <div class="confetti confetti-32"></div>
      <div class="confetti confetti-33"></div>
      <div class="confetti confetti-34"></div>
      <div class="confetti confetti-35"></div>
      <div class="confetti confetti-36"></div>
      <div class="confetti confetti-37"></div>
      <div class="confetti confetti-38"></div>
      <div class="confetti confetti-39"></div>
      <div class="confetti confetti-40"></div>
    </div>
    <!-- Modal z komunikatem -->
    <div class="celebration-modal">
      <button class="celebration-close" id="celebration-close" title="Zamknij (Escape)">✕</button>
      <div class="celebration-message" id="celebration-message"></div>
    </div>
  </div>
  
  <script src="swiper.js"></script>
</body>
</html>
