<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
</head>
<body>
  <h1>Icon Generator</h1>
  <p>Otwórz konsolę deweloperską (F12) i uruchom funkcję generateIcons()</p>
  
  <canvas id="canvas" style="display: none;"></canvas>
  
  <script>
    async function generateIcons() {
      const sizes = [16, 48, 128];
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      // SVG source
      const svg = `
        <svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="20" fill="url(#grad)"/>
          <g transform="translate(32, 32)">
            <rect x="0" y="0" width="64" height="48" rx="8" fill="white" opacity="0.9"/>
            <path d="M 45 24 L 55 24 M 50 19 L 55 24 L 50 29" stroke="#51cf66" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 19 24 L 9 24 M 14 19 L 9 24 L 14 29" stroke="#ff6b6b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
      `;
      
      const img = new Image();
      const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      
      img.onload = function() {
        sizes.forEach(size => {
          canvas.width = size;
          canvas.height = size;
          ctx.clearRect(0, 0, size, size);
          ctx.drawImage(img, 0, 0, size, size);
          
          canvas.toBlob(blob => {
            const link = document.createElement('a');
            link.download = `icon${size}.png`;
            link.href = URL.createObjectURL(blob);
            link.click();
          }, 'image/png');
        });
        
        URL.revokeObjectURL(url);
        console.log('Ikony wygenerowane!');
      };
      
      img.src = url;
    }
    
    // Auto-run
    window.onload = () => {
      setTimeout(generateIcons, 500);
    };
  </script>
</body>
</html>
